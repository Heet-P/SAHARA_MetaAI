<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .t  { fill: #e6edf3; font-size: 17px; font-weight: 700; }
      .s  { fill: #9ba7b4; font-size: 13px; }
      .c  { font-size: 12px; font-weight: 600; }
      .m  { fill: #8b949e; font-size: 12px; font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
      .ln { stroke: #8b949e; stroke-width: 1.6; fill: none; }
      .lg { fill: #c9d1d9; font-size: 13px; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="1199" height="909" rx="20" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="50" fill="#e6edf3" font-size="22" font-weight="800" letter-spacing="1">SAHARA system architecture</text>
  <text x="40" y="74" class="s">From a responder's voice command down to the simulated drone, and back</text>

  <!-- responder -->
  <rect x="470" y="100" width="260" height="58" rx="29" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="600" y="125" text-anchor="middle" class="t">Rescue responder</text>
  <text x="600" y="145" text-anchor="middle" class="s">speaks or types a request</text>

  <line x1="600" y1="158" x2="600" y2="216" class="ln" marker-end="url(#arr)"/>
  <rect x="616" y="173" width="214" height="28" rx="14" fill="#3b82f6" fill-opacity="0.16" stroke="#3b82f6"/>
  <text x="723" y="192" text-anchor="middle" class="c" fill="#93c5fd">Muse Voice Transcribe 1.0</text>

  <!-- command center -->
  <rect x="40" y="218" width="1120" height="180" rx="14" fill="#161b22" stroke="#64748b" stroke-width="1.5"/>
  <text x="64" y="248" class="t">Command Center</text>
  <text x="212" y="248" class="s">Flask + rclpy web dashboard</text>

  <rect x="64" y="266" width="340" height="112" rx="10" fill="#7c5cff" fill-opacity="0.08" stroke="#7c5cff"/>
  <text x="84" y="294" class="t">AI Mission Commander</text>
  <text x="84" y="316" class="s">Turns requests into tool calls that fly the drone</text>
  <rect x="84" y="334" width="186" height="26" rx="13" fill="#7c5cff" fill-opacity="0.2" stroke="#7c5cff"/>
  <text x="177" y="352" text-anchor="middle" class="c" fill="#c4b5fd">Muse Spark 1.3 · agent</text>

  <rect x="430" y="266" width="340" height="112" rx="10" fill="#7c5cff" fill-opacity="0.08" stroke="#7c5cff"/>
  <text x="450" y="294" class="t">Aerial triage + SITREP</text>
  <text x="450" y="316" class="s">Casualty briefing and situation report</text>
  <rect x="450" y="334" width="190" height="26" rx="13" fill="#7c5cff" fill-opacity="0.2" stroke="#7c5cff"/>
  <text x="545" y="352" text-anchor="middle" class="c" fill="#c4b5fd">Muse Spark 1.3 · vision</text>

  <rect x="796" y="266" width="340" height="112" rx="10" fill="#64748b" fill-opacity="0.1" stroke="#64748b"/>
  <text x="816" y="294" class="t">Operator dashboard</text>
  <text x="816" y="316" class="s">Live map, alerts, rescue priorities</text>
  <rect x="816" y="334" width="150" height="26" rx="13" fill="#64748b" fill-opacity="0.22" stroke="#64748b"/>
  <text x="891" y="352" text-anchor="middle" class="c" fill="#cbd5e1">Live feed · SITREP</text>

  <!-- CC <-> bridge -->
  <line x1="470" y1="398" x2="470" y2="456" class="ln" marker-end="url(#arr)"/>
  <text x="458" y="432" text-anchor="end" class="m">/resq/ai/command</text>
  <line x1="730" y1="456" x2="730" y2="400" class="ln" marker-end="url(#arr)"/>
  <text x="742" y="432" class="m">/resq/map · 2 Hz</text>

  <!-- mission bridge -->
  <rect x="40" y="458" width="1120" height="92" rx="14" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="64" y="490" class="t">Mission bridge</text>
  <text x="200" y="490" class="m" fill="#fcd34d">mavlink_bridge · ROS 2 Humble</text>
  <text x="64" y="522" class="s">Mission state machine  ·  Bayesian search planner  ·  obstacle guard  ·  hazard map  ·  A* safe ground routes  ·  safety geofence</text>

  <!-- row 4 -> bridge -->
  <line x1="210" y1="620" x2="210" y2="552" class="ln" marker-end="url(#arr)"/>
  <text x="222" y="592" class="m">/detections/*</text>
  <line x1="600" y1="620" x2="600" y2="552" class="ln" marker-end="url(#arr)"/>
  <text x="612" y="592" class="m">/ai/sam/result</text>
  <line x1="990" y1="552" x2="990" y2="618" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1002" y="592" class="m">MAVLink</text>

  <!-- person detector -->
  <rect x="40" y="620" width="340" height="112" rx="14" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="60" y="650" class="t">Person detector</text>
  <text x="60" y="672" class="s">YOLOv8m (RGB) + thermal YOLO (HIT-UAV)</text>
  <text x="60" y="692" class="s">RGB / thermal fusion, geo-tagged</text>
  <text x="60" y="716" class="c" fill="#67e8f9">Runs on device, no cloud</text>

  <!-- hazard perception -->
  <rect x="430" y="620" width="340" height="112" rx="14" fill="#14b8a6" fill-opacity="0.08" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="450" y="650" class="t">Hazard perception</text>
  <text x="450" y="672" class="s">Smoke, downed power lines, landslides</text>
  <rect x="450" y="688" width="80" height="26" rx="13" fill="#14b8a6" fill-opacity="0.2" stroke="#14b8a6"/>
  <text x="490" y="706" text-anchor="middle" class="c" fill="#5eead4">SAM 3.1</text>
  <rect x="540" y="688" width="190" height="26" rx="13" fill="#7c5cff" fill-opacity="0.2" stroke="#7c5cff"/>
  <text x="635" y="706" text-anchor="middle" class="c" fill="#c4b5fd">Muse Spark 1.3 · vision</text>

  <!-- ardupilot -->
  <rect x="820" y="620" width="340" height="112" rx="14" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="1.5"/>
  <text x="840" y="650" class="t">ArduPilot SITL</text>
  <text x="840" y="672" class="s">ArduCopter flight controller</text>
  <text x="840" y="692" class="s">GUIDED mode, failsafes, return home</text>

  <!-- gazebo -> row 4 -->
  <line x1="210" y1="780" x2="210" y2="734" class="ln" marker-end="url(#arr)"/>
  <line x1="600" y1="780" x2="600" y2="734" class="ln" marker-end="url(#arr)"/>
  <text x="405" y="762" text-anchor="middle" class="m">RGB + thermal frames</text>
  <line x1="990" y1="734" x2="990" y2="778" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1002" y="762" class="m">sensors / motors</text>

  <!-- gazebo -->
  <rect x="40" y="780" width="1120" height="68" rx="14" fill="#22c55e" fill-opacity="0.06" stroke="#22c55e" stroke-width="1.5"/>
  <text x="64" y="811" class="t">Gazebo Harmonic</text>
  <text x="64" y="832" class="s">S500 quadcopter  ·  RGB + thermal cameras  ·  forward lidar  ·  post-disaster world with casualties, fires and floods</text>

  <!-- legend -->
  <g transform="translate(40,882)">
    <circle cx="6" cy="-4" r="6" fill="#7c5cff"/><circle cx="20" cy="-4" r="6" fill="#14b8a6"/><circle cx="34" cy="-4" r="6" fill="#3b82f6"/>
    <text x="48" y="0" class="lg">Meta AI models</text>
    <circle cx="186" cy="-4" r="6" fill="#64748b"/><text x="198" y="0" class="lg">Command center</text>
    <circle cx="336" cy="-4" r="6" fill="#f59e0b"/><text x="348" y="0" class="lg">ROS 2 autonomy</text>
    <circle cx="482" cy="-4" r="6" fill="#06b6d4"/><text x="494" y="0" class="lg">On-device perception</text>
    <circle cx="664" cy="-4" r="6" fill="#22c55e"/><text x="676" y="0" class="lg">Flight stack + simulation</text>
  </g>
</svg>
